<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f9f4">
<title>TPO Ciencia de Datos · Presentación</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5f9f4'/%3E%3Cpath d='M0 8h32M0 16h32M0 24h32M8 0v32M16 0v32M24 0v32' stroke='%232e9c6a' stroke-opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231f3fbf'/%3E%3C/svg%3E">
<link rel="stylesheet" href="estilos.css">
<style>
  /* Láminas = el PDF de la defensa pasado a imágenes (app/laminas). Sin red ni librerías. */
  html,body{height:100%}
  body{display:flex;flex-direction:column}
  .tools{display:flex;align-items:center;gap:6px}
  #contador{min-width:72px;text-align:center;font:700 17px/1 var(--cond);letter-spacing:.06em}
  #escenario{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:16px;cursor:pointer;user-select:none}
  #escenario:fullscreen{padding:0;cursor:none}
  #escenario:fullscreen:hover{cursor:default}
  .lamina{display:block;max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:16/9;object-fit:contain}
  .js #escenario .lamina:not(.actual){display:none}
  /* Sin JavaScript: las láminas quedan una debajo de la otra */
  html:not(.js) #escenario{flex-direction:column;gap:16px;cursor:auto}
  html:not(.js) .tools{display:none}
  .ayuda{margin:0;padding:6px 16px;background:var(--ink);color:#c9d6ce;font:500 14px/1.3 var(--cond);letter-spacing:.06em;text-transform:uppercase;text-align:center}
  @media(max-width:860px){.ayuda{display:none}}
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html#revisar" aria-label="TPO Ciencia de Datos, volver al tablero">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x=".75" y=".75" width="30.5" height="30.5"/><path class="ticks" d="M8 .75v4M16 .75v6M24 .75v4M.75 8h4M.75 16h6M.75 24h4"/><circle cx="17" cy="15" r="6.5"/></svg>
    <span class="brand-name">TPO<span>/</span>Ciencia de Datos</span>
    <span class="brand-meta">Defensa 12/11/2026</span>
  </a>
  <nav aria-label="Vistas">
    <a href="index.html#revisar">Parques</a>
    <a href="index.html#sitio">Sitio nuevo</a>
    <a href="index.html#modelos">Modelos</a>
    <a href="index.html#atlas">Datos</a>
    <a href="gemelo.html">Gemelo</a>
    <a aria-current="page">Presentación</a>
  </nav>
  <div class="tools">
    <button id="anterior" class="ghost-button" type="button" aria-label="Lámina anterior">‹</button>
    <span id="contador" aria-live="polite">1 / 13</span>
    <button id="siguiente" class="ghost-button" type="button" aria-label="Lámina siguiente">›</button>
    <button id="completa" class="ghost-button" type="button" title="Tecla F">Pantalla completa</button>
  </div>
</header>
<main id="escenario" aria-label="Láminas de la defensa">
  <img class="lamina" src="laminas/l01.png" alt="Lámina 1 de 13: Detector Solar. Encontramos la energía que falta en los parques solares">
  <img class="lamina" src="laminas/l02.png" alt="Lámina 2 de 13: Cuánto debería generar cada parque">
  <img class="lamina" src="laminas/l03.png" alt="Lámina 3 de 13: USD 12 M en juego, 87 % en tres parques">
  <img class="lamina" src="laminas/l04.png" alt="Lámina 4 de 13: En junio se rinde la mitad que en enero">
  <img class="lamina" src="laminas/l05.png" alt="Lámina 5 de 13: Cómo detectamos un rendimiento bajo">
  <img class="lamina" src="laminas/l06.png" alt="Lámina 6 de 13: De los datos públicos al tablero">
  <img class="lamina" src="laminas/l07.png" alt="Lámina 7 de 13: Jujuy rinde casi el doble que Córdoba">
  <img class="lamina" src="laminas/l08.png" alt="Lámina 8 de 13: Probamos seis modelos, ganó XGBoost">
  <img class="lamina" src="laminas/l09.png" alt="Lámina 9 de 13: Con datos por hora, el aviso llega en una hora">
  <img class="lamina" src="laminas/l10.png" alt="Lámina 10 de 13: Sin nadie mirando, el aviso llega al celular">
  <img class="lamina" src="laminas/l11.png" alt="Lámina 11 de 13: Cuánto generaría un parque nuevo">
  <img class="lamina" src="laminas/l12.png" alt="Lámina 12 de 13: Qué se lleva la gerencia">
  <img class="lamina" src="laminas/l13.png" alt="Lámina 13 de 13: Muchas gracias">
</main>
<p class="ayuda">Flechas, espacio o clic para pasar · F pantalla completa · Esc para salir</p>
<script>
(() => {
  const escenario = document.getElementById('escenario');
  const laminas = [...escenario.querySelectorAll('.lamina')];
  const contador = document.getElementById('contador');
  const total = laminas.length;
  let actual = 0;

  function ir(n) {
    actual = Math.max(0, Math.min(total - 1, n));
    laminas.forEach((img, i) => img.classList.toggle('actual', i === actual));
    contador.textContent = `${actual + 1} / ${total}`;
    history.replaceState(null, '', `#${actual + 1}`);
  }

  function pantallaCompleta() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (escenario.requestFullscreen || escenario.webkitRequestFullscreen).call(escenario);
    }
  }

  const SIGUIENTE = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'];
  const ANTERIOR = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'];
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('a,button')) return;
    if (SIGUIENTE.includes(e.key)) ir(actual + 1);
    else if (ANTERIOR.includes(e.key)) ir(actual - 1);
    else if (e.key === 'Home') ir(0);
    else if (e.key === 'End') ir(total - 1);
    else if (e.key === 'f' || e.key === 'F') pantallaCompleta();
    else return;
    e.preventDefault();
  });
  // Clic en la mitad derecha avanza; en la izquierda retrocede.
  escenario.addEventListener('click', e => {
    const caja = escenario.getBoundingClientRect();
    ir(actual + (e.clientX - caja.left > caja.width / 2 ? 1 : -1));
  });
  document.getElementById('anterior').addEventListener('click', () => ir(actual - 1));
  document.getElementById('siguiente').addEventListener('click', () => ir(actual + 1));
  document.getElementById('completa').addEventListener('click', pantallaCompleta);
  addEventListener('hashchange', () => ir(parseInt(location.hash.slice(1), 10) - 1 || 0));

  ir((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
